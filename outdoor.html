<script>
function initMap() {
  const position = { lat: 35.6812, lng: 139.7671 }; // 東京駅

  const map = new google.maps.Map(document.getElementById("map"), {
    center: position,
    zoom: 14,
  });

  // custom overlay class
  class ThumbOverlay extends google.maps.OverlayView {
    constructor(position, imageUrl, title, linkUrl) {
      super();
      this.position = position;
      this.imageUrl = imageUrl;
      this.title = title;
      this.linkUrl = linkUrl;
      this.div = null;
    }

    onAdd() {
      const div = document.createElement("div");
      div.className = "custom-thumb";

      div.innerHTML = `
        <img src="${this.imageUrl}">
        <div class="title">${this.title}</div>
      `;

      div.onclick = () => {
        window.location.href = this.linkUrl;
      };

      this.div = div;

      const panes = this.getPanes();
      panes.overlayMouseTarget.appendChild(div);
    }

    draw() {
      const overlayProjection = this.getProjection();
      const pos = overlayProjection.fromLatLngToDivPixel(
        new google.maps.LatLng(this.position)
      );

      const div = this.div;
      if (div) {
        div.style.left = pos.x + "px";
        div.style.top = pos.y + "px";
      }
    }

    onRemove() {
      if (this.div) {
        this.div.parentNode.removeChild(this.div);
        this.div = null;
      }
    }
  }

  // --- サムネを配置 ---
  new ThumbOverlay(
    position,
    "https://placehold.jp/300x200.png", // ← サムネ写真
    "【レビュー】東京駅で食べたいラーメン3選",
    "/your-article-url"               // ← 遷移先URL
  ).setMap(map);
}
</script>

<style>

  overflow: hidden;
  transition: transform 0.2s ease;
}

.custom-thumb:hover {

}

.custom-thumb img {

  object-fit: cover;
}

.custom-thumb .title {

}
</style>
