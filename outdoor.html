<script>
function initMap() {
    const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 35.6812, lng: 139.7671 },
        zoom: 12,
    });

    // 記事データ
    const places = [
        {
            position: { lat: 35.6812, lng: 139.7671 },
            title: "東京駅キャンプギア購入品",
            thumbnail: "images/test.png",
            url: "/outdoor.html"
        },
        {
            position: { lat: 35.6895, lng: 139.6917 },
            title: "新宿アウトドアショップまとめ",
            thumbnail: "images/test.png",
            url: "/outdoor.html"
        }
    ];

    // ▼ カスタムサムネマーカー（常時表示）
    places.forEach(place => {

        class CustomMarker extends google.maps.OverlayView {
            constructor(position, map, data) {
                super();
                this.position = position;
                this.map = map;
                this.data = data;
                this.div = null;
                this.setMap(map);
            }

            onAdd() {
                this.div = document.createElement("div");
                this.div.style.position = "absolute";
                this.div.style.cursor = "pointer";

                // サムネ HTML
                this.div.innerHTML = `
                    <div style="
                        width: 80px;
                        border-radius: 10px;
                        overflow: hidden;
                        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
                        background:#fff;
                        transform: translate(-40px, -90px); 
                    ">
                        <img src="${this.data.thumbnail}" style="width:100%; display:block;">
                        <div style="padding:4px; font-size:12px;">
                            ${this.data.title}
                        </div>
                    </div>
                `;

                // クリックで記事へ飛ぶ
                this.div.addEventListener("click", () => {
                    window.location.href = this.data.url;
                });

                const panes = this.getPanes();
                panes.overlayMouseTarget.appendChild(this.div);
            }

            draw() {
                const overlayProjection = this.getProjection();
                const pos = overlayProjection.fromLatLngToDivPixel(
                    new google.maps.LatLng(this.position.lat, this.position.lng)
                );

                if (this.div) {
                    this.div.style.left = pos.x + "px";
                    this.div.style.top = pos.y + "px";
                }
            }

            onRemove() {
                if (this.div) {
                    this.div.parentNode.removeChild(this.div);
                    this.div = null;
                }
            }
        }

        new CustomMarker(place.position, map, place);
    });
}
</script>
