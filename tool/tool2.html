<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OGP生成ツール</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: sans-serif; margin: 20px; }
  textarea { width: 100%; height: 200px; margin-bottom: 10px; }
  pre { background: #f0f0f0; padding: 10px; white-space: pre-wrap; word-break: break-word; }
  button { padding: 10px 20px; font-size: 16px; }
</style>
</head>
<body>

<h1>OGP生成ツール</h1>
<p>ブログ記事のHTMLを貼り付けると、ChatGPTがOGPタグを生成します。</p>

<textarea id="html-input" placeholder="ここに記事HTMLを貼り付け"></textarea>
<br>
<button id="generate-ogp">OGP生成</button>

<h2>生成されたOGPタグ</h2>
<pre id="ogp-output"></pre>

<script>
const API_KEY = "YOUR_OPENAI_API_KEY"; // ここにAPIキーを設定

async function generateOGP(html) {
  const response = await fetch("https://api.openai.com/v1/responses", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${API_KEY}`
    },
    body: JSON.stringify({
      model: "gpt-4.1-mini",
      input: `以下のHTMLからOGPタグを生成してください。タイトルはh1、説明はpの最初の文章、画像は最初のimgを使用してください。\n\nHTML:\n${html}`
    })
  });
  
  const data = await response.json();
  // GPTの出力を取り出す
  return data.output_text || data.output?.[0]?.content?.[0]?.text || "生成に失敗しました";
}

document.getElementById("generate-ogp").addEventListener("click", async () => {
  const html = document.getElementById("html-input").value.trim();
  if (!html) {
    alert("HTMLを貼り付けてください");
    return;
  }
  document.getElementById("ogp-output").innerText = "生成中…";
  try {
    const ogp = await generateOGP(html);
    document.getElementById("ogp-output").innerText = ogp;
  } catch (err) {
    document.getElementById("ogp-output").innerText = "エラー: " + err.message;
  }
});
</script>

</body>
</html>
